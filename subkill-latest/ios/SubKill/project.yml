name: SubKill
options:
  bundleIdPrefix: com.example     # change to something unique to you, e.g. com.yourname
  deploymentTarget:
    iOS: "17.0"
targets:
  SubKill:
    type: application
    platform: iOS
    sources: [SubKill]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: SubKill
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false   # only standard HTTPS; skips the export-compliance question
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true        # lets dev builds reach http://192.168.x.x; production stays https-only
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.subkill   # must match the one you register in App Store Connect
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""                   # or pick your team in Xcode > Signing & Capabilities
